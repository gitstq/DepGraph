[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "depgraph"
version = "1.0.0"
description = "Lightweight dependency graph & supply chain risk analyzer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "DepGraph Team"},
]

[project.scripts]
depgraph = "depgraph.__main__:main"

[tool.setuptools]
packages = ["depgraph", "depgraph.parsers"]
